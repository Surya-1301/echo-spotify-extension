name: nightly

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAME: Spotify Extension
      TAG: sp
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Cook Env
        run: |
          echo -e "## ${{ env.NAME }}\n${{ github.event.head_commit.message }}" > commit.txt
          version=$( echo ${{ github.event.head_commit.id }} | cut -c1-7 )
          echo "VERSION=v$version" >> $GITHUB_ENV
          echo "APP_PATH=app/build/${{ env.TAG }}-$version.eapk" >> $GITHUB_ENV
          chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          # Generate a debug signing key
          keytool -genkeypair -v \
            -keystore /tmp/debug.jks \
            -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug,O=Debug,C=US"
          # Determine source APK (release built, may be signed or unsigned)
          APK_SRC=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
          echo "Signing source APK: $APK_SRC"
          # Sign with jarsigner
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/debug.jks \
            -storepass android \
            "$APK_SRC" debug
          # Copy to the .eapk output path
          cp "$APK_SRC" ${{ env.APP_PATH }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.APP_PATH }}

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ env.VERSION }}
          name: Spotify Extension
          body_path: commit.txt
          files: ${{ env.APP_PATH }}

      - name: Delete Old Releases
        uses: sgpublic/delete-release-action@master
        with:
          release-drop: true
          release-keep-count: 3
          release-drop-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Discord/Telegram upload steps removed — configure secrets to re-enable
