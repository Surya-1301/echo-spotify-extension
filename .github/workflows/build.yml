name: nightly

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAME: Spotify Extension
      TAG: sp
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Cook Env
        run: |
          echo -e "## ${{ env.NAME }}\n${{ github.event.head_commit.message }}" > commit.txt
          version=$( echo ${{ github.event.head_commit.id }} | cut -c1-7 )
          echo "VERSION=v$version" >> $GITHUB_ENV
          echo "APP_PATH=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          echo "FINAL_PATH=${{ env.TAG }}-$version.eapk" >> $GITHUB_ENV
          chmod +x ./gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/release.jks \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Spotify Extension,O=Echo,C=US"
          echo "KEYSTORE_PATH=/tmp/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=release" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK
        run: cp ${{ env.APP_PATH }} ${{ env.FINAL_PATH }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_PATH }}
          path: ${{ env.FINAL_PATH }}

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: ${{ env.VERSION }}
          name: Spotify Extension
          body_path: commit.txt
          files: ${{ env.FINAL_PATH }}

      - name: Delete Old Releases
        uses: sgpublic/delete-release-action@master
        with:
          release-drop: true
          release-keep-count: 3
          release-drop-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Discord/Telegram upload steps removed — configure secrets to re-enable
